name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: news-library-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.9'
          cache: false
      - name: Fetch pinned specification checker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: valpere/tumanomir
          ref: b8dfe2efb03fefb5a42da76cd29f2b44b2f1bdda
          path: .build/tumanomir-src
          persist-credentials: false
      - name: Build specification checker
        run: go build -C .build/tumanomir-src -o "$GITHUB_WORKSPACE/.build/tumanomir" ./cmd/tumanomir
      - name: Validate specification, build and application tests
        run: make check
